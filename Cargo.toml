[package]
name = "konfi"
version = "5.1.0"
edition = "2024"
description = "A simple yet powerful dotfile manager TUI made with free time and 😻"
license = "MIT" 

[dependencies]
ratatui = "0.26"
crossterm = "0.27"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
dirs = "5.0"
ansi-to-tui = "4.0"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
zip = "2.1"
age = "0.11"
globset = "0.4"
regex = "1"
zeroize = "1"
rpassword = "7"
